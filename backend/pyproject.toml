[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# SQLAlchemy overloads `==` on columns: `col == False` builds SQL, while
# `col is False` would compare Python objects and silently break the queries.
ignore = ["E712"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy models reference each other through forward-reference strings.
"app/models/*" = ["F821"]
